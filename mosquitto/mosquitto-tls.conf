# A.R.M.O.R. broker with TLS: the nodes and the server speak to it on 8883 with the certificate of the installation, and the plain port stays on the loopback of the container.
# Use it with docker-compose.tls.yml (docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d); see secrets/ for the three files it expects.
persistence true
persistence_location /mosquitto/data/
allow_anonymous false
password_file /run/secrets/mqtt_password_file
acl_file /run/secrets/mqtt_acl_file

listener 8883
cafile /run/secrets/mqtt_tls_ca
certfile /run/secrets/mqtt_tls_cert
keyfile /run/secrets/mqtt_tls_key
tls_version tlsv1.2

# The server of this same installation can still use the plain port, but only inside the container's own network namespace.
listener 1883 127.0.0.1
