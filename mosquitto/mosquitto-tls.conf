# A.R.M.O.R. broker with TLS: the nodes speak to it on 8883 with the certificate of the installation, and the plain port is not published (see docker-compose.tls.yml).
# Use it with docker-compose.tls.yml (docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d); see secrets/ for the three files it expects.
persistence true
persistence_location /mosquitto/data/
allow_anonymous false
password_file /run/secrets/mqtt_password_file
acl_file /run/secrets/mqtt_acl_file

listener 8883
cafile /run/secrets/mqtt_tls_ca
certfile /run/secrets/mqtt_tls_cert
keyfile /run/secrets/mqtt_tls_key
tls_version tlsv1.2

# The server of this same installation speaks plain MQTT to the broker over the internal network of the containers (mqtt://broker:1883). The port is listened on in the container but the TLS
# overlay does not publish it, so only the other containers of that network reach it.
listener 1883
