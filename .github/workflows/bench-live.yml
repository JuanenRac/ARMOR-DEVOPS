# Starts a real ARMOR-SERVER on the runner with throw-away tokens, plays simulated nodes into it with ARMOR-SIMULATOR and checks what the server answers over HTTP and over the
# live events socket (scripts/bench_live.py). It needs no Docker, no broker and no secret. It runs every night and can be started by hand; it reads three public repositories and
# publishes nothing.
name: Live bench

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Server and simulated nodes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ARMOR-DEVOPS
          persist-credentials: false

      - name: Check out the server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/ARMOR-SERVER
          path: ARMOR-SERVER
          persist-credentials: false

      - name: Check out the simulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/ARMOR-SIMULATOR
          path: ARMOR-SIMULATOR
          persist-credentials: false

      - name: Check out the contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JuanenRac/ARMOR-COMMON
          path: ARMOR-COMMON
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build the server
        working-directory: ARMOR-SERVER
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Run the bench
        run: python ARMOR-DEVOPS/scripts/bench_live.py --server ARMOR-SERVER --simulator ARMOR-SIMULATOR --seconds 10
