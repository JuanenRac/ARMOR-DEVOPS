# The tests are run under coverage (lines and branches of scripts/) and the run fails when either figure falls below the floor in docs/coverage_threshold.json. The floor
# is a little under what the tests reach; raising it is a change of that file, made with a figure measured by a run of this workflow.
name: Coverage floor

on:
  push:
    paths:
      - "scripts/**"
      - "docs/coverage_threshold.json"
      - ".github/workflows/coverage-floor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  floor:
    name: Measure the coverage and hold the floor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Fetch the repositories the tests compare against
        run: |
          git clone --depth 1 https://github.com/JuanenRac/ARMOR-COMMON.git ../ARMOR-COMMON

      - name: Install coverage
        run: python -m pip install --quiet coverage 

      - name: Run the tests under coverage
        run: |
          python -W ignore -m coverage run --branch --source=scripts --omit='scripts/test_*' -m unittest discover -s scripts -p 'test_*.py'
          python -m coverage report --show-missing --skip-empty
          python -m coverage json -o coverage.json

      - name: Hold the floor
        run: |
          python - <<'PY'
          import json, sys
          totals = json.load(open("coverage.json"))["totals"]
          floor = json.load(open("docs/coverage_threshold.json"))
          lines = 100 * totals["covered_lines"] / max(1, totals["num_statements"])
          branches = 100 * totals["covered_branches"] / max(1, totals["num_branches"])
          print(f"lines {lines:.2f} % (floor {floor['lines']}), branches {branches:.2f} % (floor {floor['branches']})")
          if lines < floor["lines"] or branches < floor["branches"]:
              sys.exit("the coverage fell below the floor of docs/coverage_threshold.json")
          PY
