# Copyright (C) 2026 JuanenRac (Electro Hobby 3D). GPL-3.0-or-later.
#
# Studio is published on the loopback address, and so is the broker's port (ARMOR_MQTT_BIND puts it on the address of the field network, for the nodes). Put a TLS reverse
# proxy or a VPN in front of it before any remote access. Secrets come from .env
# (created by scripts/generate_secrets.sh) and from ./secrets, never from git.
name: armor

x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  # A runaway process can not take the whole machine down with it: a limit of processes for every service (and, below, of memory and CPU for each one). The limits are
  # generous on purpose; ARMOR_PIDS_LIMIT, ARMOR_MEM_<SERVICE> and ARMOR_CPUS_<SERVICE> in .env change them, and 0 means no limit.
  pids_limit: ${ARMOR_PIDS_LIMIT:-512}

services:
  broker:
    <<: *hardened
    mem_limit: ${ARMOR_MEM_BROKER:-256m}
    cpus: ${ARMOR_CPUS_BROKER:-1}
    image: eclipse-mosquitto:2.0.21   # a patch version, not the floating series: an update of the broker is a decision, not something a pull does
    # The image starts as root and drops to its own user; that needs these three, everything else stays dropped.
    cap_add: [CHOWN, SETUID, SETGID]
    tmpfs: ["/tmp", "/mosquitto/log"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker-data:/mosquitto/data
    secrets: [mqtt_password_file, mqtt_acl_file]
    # The nodes are on the LAN: a port on an internal network can not be published, so the broker is on the edge network too. It listens on loopback unless ARMOR_MQTT_BIND is the
    # address of the interface of the field network (the broker is never anonymous, and the ACL gives each node only its own topics).
    ports: ["${ARMOR_MQTT_BIND:-127.0.0.1}:18883:18883"]
    # The image has no check of its own: the broker is healthy while its process runs.
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null || exit 1"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s
    networks: [armor_core, armor_edge]

  server:
    <<: *hardened
    mem_limit: ${ARMOR_MEM_SERVER:-1g}
    cpus: ${ARMOR_CPUS_SERVER:-2}
    build: ../ARMOR-SERVER
    tmpfs: ["/tmp"]
    volumes:
      - server-data:/data
    environment:
      ARMOR_HOST: 0.0.0.0
      ARMOR_PORT: 18080
      ARMOR_DATA_DIR: /data
      ARMOR_INGEST_TOKEN: ${ARMOR_INGEST_TOKEN:?run scripts/generate_secrets.sh}
      ARMOR_CONTROL_TOKEN: ${ARMOR_CONTROL_TOKEN:?run scripts/generate_secrets.sh}
      ARMOR_OPERATOR_TOKEN: ${ARMOR_OPERATOR_TOKEN:?run scripts/generate_secrets.sh}
      ARMOR_CAMERA_CONFIG_KEY: ${ARMOR_CAMERA_CONFIG_KEY:?run scripts/generate_secrets.sh}
      ARMOR_STUDIO_USERNAME: ${ARMOR_STUDIO_USERNAME:?run scripts/generate_secrets.sh}
      ARMOR_STUDIO_PASSWORD: ${ARMOR_STUDIO_PASSWORD:?run scripts/generate_secrets.sh}
      ARMOR_STUDIO_ORIGIN: ${ARMOR_PUBLIC_ORIGIN:-http://127.0.0.1:18081}
      # The cookie is Secure whenever the address the browser uses is https (the TLS profile sets ARMOR_PUBLIC_ORIGIN=https://...): 0 or 1 in .env overrides that.
      ARMOR_COOKIE_SECURE: ${ARMOR_COOKIE_SECURE:-}
      ARMOR_MQTT_URL: mqtt://broker:18883
      ARMOR_MQTT_USERNAME: ${ARMOR_MQTT_USERNAME:-armor-server}
      ARMOR_MQTT_PASSWORD: ${ARMOR_MQTT_PASSWORD:?run scripts/generate_secrets.sh}
      ARMOR_ALERT_DWELL_MS: ${ARMOR_ALERT_DWELL_MS:-2000}
      ARMOR_ALERT_WEBHOOK_URL: ${ARMOR_ALERT_WEBHOOK_URL:-}
      ARMOR_ALERT_WEBHOOK_SECRET: ${ARMOR_ALERT_WEBHOOK_SECRET:-}
      # What .env says reaches the container only if it is named here (Compose reads .env to fill these in, it does not hand the file over). An empty value is the server's own default.
      ARMOR_DISARM_PIN: ${ARMOR_DISARM_PIN:-}
      ARMOR_ALERT_MIN_TARGETS: ${ARMOR_ALERT_MIN_TARGETS:-1}
      ARMOR_ALERT_LANGUAGE: ${ARMOR_ALERT_LANGUAGE:-es}
      ARMOR_ALARM_COMMANDS: ${ARMOR_ALARM_COMMANDS:-}
      ARMOR_ELECTRICAL_SWITCHING: ${ARMOR_ELECTRICAL_SWITCHING:-}
      ARMOR_CONTROL_DISARM: ${ARMOR_CONTROL_DISARM:-}
      ARMOR_INGEST_STRICT: ${ARMOR_INGEST_STRICT:-}
      ARMOR_HA_DISCOVERY: ${ARMOR_HA_DISCOVERY:-}
      ARMOR_HA_DISCOVERY_PREFIX: ${ARMOR_HA_DISCOVERY_PREFIX:-homeassistant}
      ARMOR_TELEGRAM_BOT_TOKEN: ${ARMOR_TELEGRAM_BOT_TOKEN:-}
      ARMOR_TELEGRAM_CHAT_IDS: ${ARMOR_TELEGRAM_CHAT_IDS:-}
      ARMOR_NTFY_URL: ${ARMOR_NTFY_URL:-}
      ARMOR_NTFY_TOKEN: ${ARMOR_NTFY_TOKEN:-}
      # Studio's proxy puts the address of the client in X-Forwarded-For: the server believes it only from the private ranges of the containers' network, so the limits of the login
      # and the audit log see each client and not the proxy.
      ARMOR_TRUST_PROXY: ${ARMOR_TRUST_PROXY:-uniquelocal}
      # Using the server from outside the house (see ARMOR-SERVER docs/REMOTE_ACCESS.md); empty is the server's own default.
      ARMOR_LOCAL_NETWORKS: ${ARMOR_LOCAL_NETWORKS:-}
      ARMOR_VPN_NETWORKS: ${ARMOR_VPN_NETWORKS:-}
      ARMOR_TOTP_REQUIRED: ${ARMOR_TOTP_REQUIRED:-}
      ARMOR_REMOTE_POLICY: ${ARMOR_REMOTE_POLICY:-}
      ARMOR_REMOTE_SESSION_TTL_MS: ${ARMOR_REMOTE_SESSION_TTL_MS:-}
      ARMOR_REMOTE_IDLE_MS: ${ARMOR_REMOTE_IDLE_MS:-}
      ARMOR_ELEVATION_MS: ${ARMOR_ELEVATION_MS:-}
    depends_on:
      broker: { condition: service_started }
    # The server reaches out: the alarms to Telegram and the webhook, the cameras of the LAN, the releases of GitHub for the nodes' updates and the inspection of the router. No port of
    # it is published; Studio's proxy reaches it over the core network.
    networks: [armor_core, armor_edge]

  studio:
    <<: *hardened
    mem_limit: ${ARMOR_MEM_STUDIO:-256m}
    cpus: ${ARMOR_CPUS_STUDIO:-1}
    build: ../ARMOR-STUDIO
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp", "/etc/nginx/conf.d"]
    # The unprivileged nginx needs these to start; everything else stays dropped.
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    environment:
      ARMOR_PUBLIC_ORIGIN: ${ARMOR_PUBLIC_ORIGIN:-http://127.0.0.1:18081}
      ARMOR_SERVER_UPSTREAM: server:18080
    # Loopback unless ARMOR_STUDIO_BIND names the address of the network the clients (the wall panel, the phones, the network node) are on: they reach the API through this port.
    ports: ["${ARMOR_STUDIO_BIND:-127.0.0.1}:18081:80"]
    depends_on:
      server: { condition: service_healthy }
    networks: [armor_core, armor_edge]

  # The virtual bench: `docker compose --profile bench up -d --build` adds simulated nodes that deliver to the server in real time, for demonstrations and for end-to-end
  # runs of Studio and the apps with no hardware. Off by default; it only reaches the server over the core network and holds no secret but the ingest token the server has.
  simulator:
    <<: *hardened
    mem_limit: ${ARMOR_MEM_SIMULATOR:-256m}
    cpus: ${ARMOR_CPUS_SIMULATOR:-1}
    profiles: [bench]
    build: ../ARMOR-SIMULATOR
    user: "10001:10001"
    tmpfs: ["/tmp"]
    environment:
      ARMOR_SIM_SERVER_URL: http://server:18080
      ARMOR_INGEST_TOKEN: ${ARMOR_INGEST_TOKEN:?run scripts/generate_secrets.sh}
      ARMOR_INGEST_STRICT: ${ARMOR_INGEST_STRICT:-}
      ARMOR_SIM_NODES: ${ARMOR_SIM_NODES:-3}
      ARMOR_SIM_SCENARIO: ${ARMOR_SIM_SCENARIO:-patrol}
      ARMOR_SIM_LIGHT: ${ARMOR_SIM_LIGHT:-cycle}
      ARMOR_SIM_INTERVAL_MS: ${ARMOR_SIM_INTERVAL_MS:-1000}
      ARMOR_SIM_SOLAR: ${ARMOR_SIM_SOLAR:-}
      ARMOR_SIM_ELECTRICAL: ${ARMOR_SIM_ELECTRICAL:-}
      ARMOR_SIM_FAULT: ${ARMOR_SIM_FAULT:-none}
      ARMOR_SIM_ALLOW_INVALID: ${ARMOR_SIM_ALLOW_INVALID:-}
    depends_on:
      server: { condition: service_healthy }
    networks: [armor_core]
  # Optional TLS in front of Studio: `docker compose --profile tls up`. Caddy issues a
  # certificate from its own local authority (see docs/BACKUP_AND_TLS.md).
  proxy:
    <<: *hardened
    mem_limit: ${ARMOR_MEM_PROXY:-256m}
    cpus: ${ARMOR_CPUS_PROXY:-1}
    profiles: [tls]
    image: caddy:2.9   # pinned to a series; pin a digest once a build has been tried on the target machine
    # The caddy binary carries a file capability (bind low ports); with every capability dropped it can not even start.
    cap_add: [NET_BIND_SERVICE]
    environment:
      ARMOR_TLS_HOST: ${ARMOR_TLS_HOST:-localhost}
      ARMOR_TLS_HSTS: ${ARMOR_TLS_HSTS:-300}
      ARMOR_TLS_ISSUER: ${ARMOR_TLS_ISSUER:-internal}
      ARMOR_TLS_PORT: ${ARMOR_TLS_PORT:-8443}
    tmpfs: ["/tmp"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    # The port the console and the API are reached by (443 for a name on the Internet), and port 80 for the certificate authority's check, which only a public certificate needs.
    ports: ["${ARMOR_TLS_BIND:-127.0.0.1}:${ARMOR_TLS_PORT:-8443}:${ARMOR_TLS_PORT:-8443}", "${ARMOR_TLS_BIND:-127.0.0.1}:${ARMOR_TLS_HTTP_PORT:-8081}:80"]
    healthcheck:
      test: ["CMD-SHELL", "pidof caddy >/dev/null || exit 1"]
      interval: 30s
      timeout: 4s
      retries: 3
    depends_on:
      studio: { condition: service_started }
    networks: [armor_edge, armor_core]
  # Optional HTTPS for the local network with the internal authority of Caddy: `docker compose --profile lan-ca up -d`. Opt-in and separate from the profile "tls", which stays
  # as it is. Only port 443 is published (no port 80, no redirect); the devices pin the fingerprint of the authority (scripts/armor_ca_fingerprint.sh).
  proxy_lan:
    <<: *hardened
    mem_limit: ${ARMOR_MEM_PROXY_LAN:-256m}
    cpus: ${ARMOR_CPUS_PROXY_LAN:-1}
    profiles: [lan-ca]
    image: caddy:2.9
    cap_add: [NET_BIND_SERVICE]
    environment:
      ARMOR_LAN_HOST: ${ARMOR_LAN_HOST:-armor.lan}
    tmpfs: ["/tmp"]
    volumes:
      - ./caddy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - lan-ca-data:/data
      - lan-ca-config:/config
    ports: ["${ARMOR_LAN_BIND:-127.0.0.1}:443:443"]
    healthcheck:
      test: ["CMD-SHELL", "pidof caddy >/dev/null || exit 1"]
      interval: 30s
      timeout: 4s
      retries: 3
    depends_on:
      studio: { condition: service_started }
    networks: [armor_edge, armor_core]

networks:
  armor_core:
    internal: true
  armor_edge: {}

volumes:
  broker-data:
  server-data:
  proxy-data:
  proxy-config:
  lan-ca-data:
  lan-ca-config:

secrets:
  mqtt_password_file:
    file: ./secrets/mqtt.password
  mqtt_acl_file:
    file: ./secrets/mqtt.acl
