#
# Only Studio is published, and only on the loopback address. Put a TLS reverse
# proxy or a VPN in front of it before any remote access. Secrets come from .env
# (created by scripts/generate_secrets.sh) and from ./secrets, never from git.
name: armor

x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  broker:
    <<: *hardened
    image: eclipse-mosquitto:2
    # The image starts as root and drops to its own user; that needs these three, everything else stays dropped.
    cap_add: [CHOWN, SETUID, SETGID]
    tmpfs: ["/tmp", "/mosquitto/log"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker-data:/mosquitto/data
    secrets: [mqtt_password_file, mqtt_acl_file]
    networks: [armor_core]

  server:
    <<: *hardened
    build: ../ARMOR-SERVER
    tmpfs: ["/tmp"]
    volumes:
      - server-data:/data
    environment:
      ARMOR_HOST: 0.0.0.0
      ARMOR_PORT: 8080
      ARMOR_DATA_DIR: /data
      ARMOR_INGEST_TOKEN: ${ARMOR_INGEST_TOKEN:?run scripts/generate_secrets.sh}
      ARMOR_CONTROL_TOKEN: ${ARMOR_CONTROL_TOKEN:?run scripts/generate_secrets.sh}
      ARMOR_OPERATOR_TOKEN: ${ARMOR_OPERATOR_TOKEN:?run scripts/generate_secrets.sh}
      ARMOR_CAMERA_CONFIG_KEY: ${ARMOR_CAMERA_CONFIG_KEY:?run scripts/generate_secrets.sh}
      ARMOR_STUDIO_USERNAME: ${ARMOR_STUDIO_USERNAME:?run scripts/generate_secrets.sh}
      ARMOR_STUDIO_PASSWORD: ${ARMOR_STUDIO_PASSWORD:?run scripts/generate_secrets.sh}
      ARMOR_STUDIO_ORIGIN: ${ARMOR_PUBLIC_ORIGIN:-http://127.0.0.1:8088}
      ARMOR_COOKIE_SECURE: ${ARMOR_COOKIE_SECURE:-0}
      ARMOR_MQTT_URL: mqtt://broker:1883
      ARMOR_MQTT_USERNAME: ${ARMOR_MQTT_USERNAME:-armor-server}
      ARMOR_MQTT_PASSWORD: ${ARMOR_MQTT_PASSWORD:?run scripts/generate_secrets.sh}
      ARMOR_ALERT_DWELL_MS: ${ARMOR_ALERT_DWELL_MS:-2000}
      ARMOR_ALERT_WEBHOOK_URL: ${ARMOR_ALERT_WEBHOOK_URL:-}
      ARMOR_ALERT_WEBHOOK_SECRET: ${ARMOR_ALERT_WEBHOOK_SECRET:-}
    depends_on:
      broker: { condition: service_started }
    networks: [armor_core]

  studio:
    <<: *hardened
    build: ../ARMOR-STUDIO
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp", "/etc/nginx/conf.d"]
    # The unprivileged nginx needs these to start; everything else stays dropped.
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    environment:
      ARMOR_PUBLIC_ORIGIN: ${ARMOR_PUBLIC_ORIGIN:-http://127.0.0.1:8088}
      ARMOR_SERVER_UPSTREAM: server:8080
    ports: ["127.0.0.1:8088:80"]
    depends_on:
      server: { condition: service_healthy }
    networks: [armor_core, armor_edge]

  # Optional TLS in front of Studio: `docker compose --profile tls up`. Caddy issues a
  # certificate from its own local authority (see docs/BACKUP_AND_TLS.md).
  proxy:
    <<: *hardened
    profiles: [tls]
    image: caddy:2
    # The caddy binary carries a file capability (bind low ports); with every capability dropped it can not even start.
    cap_add: [NET_BIND_SERVICE]
    environment:
      ARMOR_TLS_HOST: ${ARMOR_TLS_HOST:-localhost}
    tmpfs: ["/tmp"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    ports: ["${ARMOR_TLS_BIND:-127.0.0.1}:8443:8443"]
    depends_on:
      studio: { condition: service_started }
    networks: [armor_edge, armor_core]

networks:
  armor_core:
    internal: true
  armor_edge: {}

volumes:
  broker-data:
  server-data:
  proxy-data:
  proxy-config:

secrets:
  mqtt_password_file:
    file: ./secrets/mqtt.password
  mqtt_acl_file:
    file: ./secrets/mqtt.acl
